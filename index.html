<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>

        <div class="conteudo">
            <div class="botoes">
                <button class="botao ativo">Concluir o Ensino Médio </button>
                <button class="botao">Fazer uma festa de formatura</button>
                <button class="botao">Iniciar uma Faculdade</button>
                <button class="botao">Fazer uma Viagem</button>
            </div>

            <div class="abas-textos">
                <div class="aba-conteudo ativo">
                    <h3 class="aba-conteudo-titulo-principal">Concluir o Ensino Médio</h3>
                    <h4 class="aba-conteudo-titulo-secundario"> 2 Meses </h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Fazer uma festa de formatura</h3>
                    <h4 class="aba-conteudo-titulo-secundario"> 2 Meses</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Iniciar uma Faculdade </h3>
                    <h4 class="aba-conteudo-titulo-secundario">4 Meses</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Fazer uma Viagem </h3>
                    <h4 class="aba-conteudo-titulo-secundario">3 Meses</h4>
                    <div class="contador"></div>
                </div>
            </div>
        </div>

    </section>
    <script src="main.js"></script>
</body>

</html>
